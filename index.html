<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LUMEN | Premium Memory Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Ambient Glows -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>
    <canvas id="confetti-canvas"></canvas>

    <div class="app-wrapper">
        <!-- ================= START SCREEN ================= -->
        <section id="start-screen" class="screen active">
            <div class="menu-card glass-panel">
                <div class="logo-wrapper">
                    <div class="logo-icon">✦</div>
                    <h1 class="game-title">Tileworks<span class="gradient-text">PAIRS</span></h1>
                    <p class="game-subtitle">Match the pairs</p>
                </div>

                <div class="difficulty-picker">
                    <span class="picker-label">CHOOSE DIFFICULTY</span>
                    <div class="diff-buttons">
                        <button class="diff-btn active" data-diff="easy">
                            <span class="diff-title">Easy</span>
                            <span class="diff-meta">3 × 4 Grid (6 Pairs)</span>
                        </button>
                        <button class="diff-btn" data-diff="medium">
                            <span class="diff-title">Medium</span>
                            <span class="diff-meta">4 × 4 Grid (8 Pairs)</span>
                        </button>
                        <button class="diff-btn" data-diff="hard">
                            <span class="diff-title">Hard</span>
                            <span class="diff-meta">4 × 6 Grid (12 Pairs)</span>
                        </button>
                    </div>
                </div>

                <div class="menu-actions">
                    <button id="start-game-btn" class="glow-btn primary-btn">
                        <span>START GAME</span>
                        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                    <div class="menu-sub-actions">
                        <button id="menu-sound-btn" class="icon-toggle-btn" aria-label="Toggle Sound">
                            <svg class="sound-on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                            <svg class="sound-off-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                        </button>
                        <div class="best-score-badge">
                            <span class="badge-lbl">BEST</span>
                            <span id="menu-best-score" class="badge-val">0 PTS</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= MAIN GAME SCREEN ================= -->
        <section id="game-screen" class="screen">
            <header class="hud-header glass-panel">
                <button id="home-btn" class="hud-icon-btn" title="Main Menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </button>

                <div class="hud-stats">
                    <div class="hud-stat-pill">
                        <span class="pill-label">TIME</span>
                        <span id="hud-timer" class="pill-val">00:00</span>
                    </div>
                    <div class="hud-stat-pill">
                        <span class="pill-label">MOVES</span>
                        <span id="hud-moves" class="pill-val">0</span>
                    </div>
                    <div class="hud-stat-pill">
                        <span class="pill-label">SCORE</span>
                        <span id="hud-score" class="pill-val">0</span>
                    </div>
                </div>

                <div class="hud-actions">
                    <button id="game-sound-btn" class="hud-icon-btn" title="Toggle Sound">
                        <svg class="sound-on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                        <svg class="sound-off-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                    </button>
                    <button id="hud-restart-btn" class="hud-icon-btn" title="Restart">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                    </button>
                </div>
            </header>

            <!-- Combo Multiplier Floating Toast -->
            <div id="combo-toast" class="combo-toast">COMBO ×2!</div>

            <!-- Dynamic Board -->
            <main class="board-container">
                <div id="game-board" class="game-board diff-medium"></div>
            </main>
        </section>

        <!-- ================= VICTORY MODAL ================= -->
        <div id="victory-modal" class="modal-overlay">
            <div class="victory-card glass-panel">
                <div class="stars-rating">
                    <div class="star star-1">★</div>
                    <div class="star star-2">★</div>
                    <div class="star star-3">★</div>
                </div>

                <div class="victory-header">
                    <span id="win-record-badge" class="new-record-tag hidden">✦ NEW RECORD ✦</span>
                    <h2 class="victory-title">MATRIX CLEARED</h2>
                    <p class="victory-subtitle">Exceptional mental acuity demonstrated</p>
                </div>

                <div class="victory-stats-grid">
                    <div class="v-stat-card">
                        <span class="v-label">FINAL SCORE</span>
                        <span id="v-final-score" class="v-val highlight">0</span>
                    </div>
                    <div class="v-stat-card">
                        <span class="v-label">TIME</span>
                        <span id="v-final-time" class="v-val">00:00</span>
                    </div>
                    <div class="v-stat-card">
                        <span class="v-label">TOTAL MOVES</span>
                        <span id="v-final-moves" class="v-val">0</span>
                    </div>
                    <div class="v-stat-card">
                        <span class="v-label">ACCURACY</span>
                        <span id="v-final-accuracy" class="v-val">100%</span>
                    </div>
                </div>

                <div class="victory-actions">
                    <button id="victory-replay-btn" class="glow-btn primary-btn">
                        <span>PLAY AGAIN</span>
                    </button>
                    <button id="victory-home-btn" class="glow-btn secondary-btn">
                        <span>MAIN MENU</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
